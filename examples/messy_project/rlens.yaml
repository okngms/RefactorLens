# messy_project kendi config'iyle gelir: hem demo hem "config gerçekten okunuyor mu" testi.
scan:
  exclude: ["tests/"]
  output_dir: reports/
provider:
  name: groq
  model: openai/gpt-oss-120b
advise:
  top_n: 3

# Deney fikstürü: FINDINGS-1/2 bu eşiklerle üretildi. v2.1'de varsayılan LCOM4
# eşiği 5/10 oldu (docs/v2-tanim-kararlari.md K8); burada sabitlenmezse deney
# yeniden koşulduğunda prompt'taki [WARN]/[CRITICAL] bayrakları ve hedef
# seçimi değişir.
thresholds:
  lcom4: {warn: 2, critical: 4}
