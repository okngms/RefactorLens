# RefactorLens'in kendini taraması için.
#
# Bu dosya dogfooding'in ilk adımı: araç kendi deposunda koşturulduğunda
# fikstürleri ve deney kopyalarını ölçüyordu, kendi kodunu değil.
#
# `experiments/*/cases/*/project/` altında deney koşusunun ürettiği fikstür
# kopyaları yaşar. Git'e girmezler ama diskte dururlar; taramaya dahil
# olduklarında aynı sınıf onlarca kez sayılır ve ölçüm anlamsızlaşır.
scan:
  include: ["src/"]
  exclude:
    - "examples/"
    - "experiments/"
    - "tests/"

# Kendi katman beyanı (docs/v2-sertlestirme.md Blok 3). Gerekçe ve alternatif
# beyanın ölçümü: docs/self-architecture.md. `report/` sunum katmanıdır:
# kullanıcının gördüğü her şeyi üretir ve üst katmanların sonuçlarını okur.
arch:
  layers:
    presentation: ["src/rlens/cli.py", "src/rlens/report/"]
    application: ["src/rlens/advise/", "src/rlens/verify/", "src/rlens/explain/"]
    domain: ["src/rlens/analysis/"]
    infrastructure: ["src/rlens/llm/", "src/rlens/integrations/", "src/rlens/providers/"]

# Dogfooding döngüsü (Blok 3). Model adı koda gömülmez; FINDINGS-1/2'de
# kullanılanla aynı.
provider:
  name: groq
  model: openai/gpt-oss-120b
