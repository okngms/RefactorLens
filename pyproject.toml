[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refactorlens"
description = "Metric-grounded AI code review CLI for Python codebases."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Okan GUMUS", email = "okanngumus4@gmail.com" }]
dynamic = ["version"]
keywords = ["static-analysis", "code-quality", "refactoring", "llm", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/okngms/RefactorLens"
Source = "https://github.com/okngms/RefactorLens"
Issues = "https://github.com/okngms/RefactorLens/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
rlens = "rlens.cli:main"

[tool.hatch.version]
# Tek kaynak: src/rlens/__init__.py içindeki __version__
path = "src/rlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rlens"]

[tool.hatch.build.targets.sdist]
# Ham deney verisi sdist'e girmez. `experiments/` altındaki betikler kalır —
# `tests/test_experiments_v2.py` onları import eder, dolayısıyla sdist açılıp
# test koşulabilir olmalıdır. Giren şey kod, girmeyen şey model transkriptleri:
# 255 dosyalık ham kayıt paketi üç katına çıkarıyordu ve okunacağı yer PyPI
# değil, README'nin mutlak linkle gösterdiği depodur.
exclude = [
    "experiments/cases",
    "experiments/runs",
    "experiments/*/cases",
    "experiments/*/runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# messy_project BİLEREK kötü koddur; lint'ten muaf tutulur.
#
# experiments/**/cases: ham deney verisi. SUGGESTION.md dosyaları modelin
# ürettiği metnin birebir kaydıdır; ruff bunların içindeki kod bloklarını
# biçimlendirirse rapor edilen veri ile diskteki veri ayrışır. Deney kaydı
# yeniden biçimlendirilmez.
extend-exclude = ["examples/messy_project", "experiments/*/cases", "experiments/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
